name: Full Pico firmware build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pico-firmware-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Pico 2 W - ${{ matrix.firmware }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        firmware: [stock0031, rpi0065]
    steps:
      - uses: actions/checkout@v4
      - name: Require authorized Full sources before downloading toolchains
        run: |
          if [ ! -f private/full.cmake ]; then
            echo "::error::Full edition is required. This public fork lacks private/full.cmake and the vendor Full modules. Supply authorized Full sources through a private build context; Lite fallback is disabled."
            exit 1
          fi
      - name: Install Arm build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev pkg-config
          rustup toolchain install 1.85.1 --profile minimal --target thumbv8m.main-none-eabi
          rustup default 1.85.1
      - name: Fetch pinned Pico SDK and apply USBPods patches
        run: |
          git clone --no-checkout https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" checkout bddd20f928ce76142793bef434d4f75f4af6e433
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/pico-sdk/lib/btstack" apply "$GITHUB_WORKSPACE/sdk-patches/btstack-usbpods.patch"
          git -C "$RUNNER_TEMP/pico-sdk/lib/tinyusb" apply "$GITHUB_WORKSPACE/sdk-patches/tinyusb-usbpods.patch"
      - name: Select and validate unchanged controller firmware
        env:
          BTFW_SELECTION: ${{ matrix.firmware }}
        run: python3 tools/btfw.py --sdk "$PICO_SDK_PATH" --image "$BTFW_SELECTION" --output evidence
      - name: Test firmware parser and audit newer UART candidate
        run: |
          python3 tests/test_btfw.py "$PICO_SDK_PATH/lib/cyw43-driver/firmware/cyw43_btfw_43439.h"
          python3 tools/audit_hcd.py --output evidence/uart0076-audit.json
      - name: Configure Pico 2 W firmware
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSBPODS_LITE=OFF -DUSBPODS_REQUIRE_FULL=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify linked radio image and UF2
        run: |
          stem="$(cat build/usbpods-output-name.txt)"
          python3 tools/verify_build.py --build build --evidence evidence --stem "$stem"
      - name: Build SCO diagnostics for both Pico wireless boards
        run: |
          for board in pico_w pico2_w; do
            cmake -S tests/sco_probe -B "probe-$board" -G Ninja -DPICO_BOARD="$board" -DCMAKE_BUILD_TYPE=Release
            cmake --build "probe-$board" --parallel 2
            mkdir -p "evidence/$board"
            cp evidence/firmware.json evidence/btfw.bin "evidence/$board/"
            python3 tools/verify_build.py --build "probe-$board" --evidence "evidence/$board" --stem usbpods_sco_probe
          done
      - name: Upload firmware and verification evidence
        if: always() && hashFiles('evidence/firmware.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-full-${{ matrix.firmware }}
          if-no-files-found: error
          path: |
            build/*.uf2
            build/*.elf
            build/*.bin
            evidence/**/*.json
            probe-*/usbpods_sco_probe.uf2
            probe-*/usbpods_sco_probe.elf
            probe-*/usbpods_sco_probe.bin
            build/CMakeCache.txt
            build/compile_commands.json
