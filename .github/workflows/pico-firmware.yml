name: Pico firmware build
on:
  push:
    branches: [main, codex/eld-integration, 'work/local-windows-*', 'audit/duplex-192k-*', 'audit/sequential-validation-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      edition:
        description: Build edition (Lite is a temporary baseline, Full needs vendor sources)
        type: choice
        options: [lite, full]
        default: lite
        required: true
concurrency:
  group: pico-firmware-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-launcher:
    name: Windows automatic flash launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute PowerShell launcher contracts without USB hardware
        shell: pwsh
        run: ./tests/test_start_script.ps1
  build:
    name: Pico 2 W - ${{ matrix.firmware }} - ${{ matrix.mic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      USBPODS_EDITION: ${{ inputs.edition || 'lite' }}
      PICO_SDK_REVISION: bddd20f928ce76142793bef434d4f75f4af6e433
      RUSTUP_TOOLCHAIN: 1.85.1
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 350M
    strategy:
      fail-fast: false
      matrix:
        include:
          - {firmware: stock0031, mic: transport, decode: 'OFF'}
          - {firmware: rpi0065, mic: transport, decode: 'OFF'}
          - {firmware: rpi0065, mic: aaceld, decode: 'ON'}
          - {firmware: rpi0065, mic: aaceld-core1-experimental, decode: 'ON', dualcore: 'ON'}
    steps:
      - uses: actions/checkout@v4
      - name: Require authorized Full sources before downloading toolchains
        if: env.USBPODS_EDITION == 'full'
        run: |
          if [ ! -f private/full.cmake ]; then
            echo "::error::Full edition is required. This public fork lacks private/full.cmake and the vendor Full modules. Supply authorized Full sources through a private build context; Lite fallback is disabled."
            exit 1
          fi
      - name: Identify runner image for native dependency caches
        id: runner-image
        run: |
          echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      # Restore installed package files, rather than only downloaded .deb files.
      # The action includes the package list in its key; refresh on image changes.
      - name: Restore or install Arm build dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev pkg-config ccache
          # Newlib creates compiler search-path links in its post-install script.
          execute_install_scripts: true
          version: pico-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}
      - name: Verify restored compiler libraries and shared-library links
        run: |
          sudo ldconfig
          test -f "$(arm-none-eabi-gcc -print-file-name=nosys.specs)"
      - name: Cache pinned Rust toolchain
        id: rust-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu
          key: rust-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-1.85.1-thumbv8m.main-none-eabi
      - name: Install pinned Rust toolchain
        if: steps.rust-toolchain.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.85.1 --profile minimal --target thumbv8m.main-none-eabi
      - name: Cache LHDC Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            3rd-party/lhdcv5/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-1.85.1-thumbv8m-${{ hashFiles('3rd-party/lhdcv5/Cargo.*', '3rd-party/lhdcv5/src/**', '3rd-party/lhdcv5/.cargo/**') }}
      # Cache only the pristine checkout. Save before applying patches or selecting
      # a controller image, both of which mutate SDK files during each job.
      - name: Restore pinned Pico SDK
        id: pico-sdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: pico-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PICO_SDK_REVISION }}
      - name: Fetch pinned Pico SDK
        if: steps.pico-sdk.outputs.cache-hit != 'true'
        run: |
          git init "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" remote add origin https://github.com/raspberrypi/pico-sdk.git
          git -C "$PICO_SDK_PATH" fetch --depth 1 origin "$PICO_SDK_REVISION"
          git -C "$PICO_SDK_PATH" checkout --detach FETCH_HEAD
          git -C "$PICO_SDK_PATH" submodule update --init --depth 1
      - name: Save pristine Pico SDK
        if: steps.pico-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: ${{ steps.pico-sdk.outputs.cache-primary-key }}
      - name: Apply USBPods SDK patches
        run: |
          test "$(git -C "$PICO_SDK_PATH" rev-parse HEAD)" = "$PICO_SDK_REVISION"
          git -C "$PICO_SDK_PATH/lib/btstack" apply "$GITHUB_WORKSPACE/sdk-patches/btstack-usbpods.patch"
          git -C "$PICO_SDK_PATH/lib/tinyusb" apply "$GITHUB_WORKSPACE/sdk-patches/tinyusb-usbpods.patch"
      - name: Restore compiled C and C++ objects
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.PICO_SDK_REVISION }}-${{ env.USBPODS_EDITION }}-${{ matrix.firmware }}-${{ matrix.mic }}-${{ hashFiles('sdk-patches/*.patch', '**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.PICO_SDK_REVISION }}-${{ env.USBPODS_EDITION }}-${{ matrix.firmware }}-${{ matrix.mic }}-${{ hashFiles('sdk-patches/*.patch', '**/CMakeLists.txt', '**/*.cmake') }}-
      - name: Configure compiler cache
        run: |
          ccache --zero-stats
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - name: Test microphone protocol, lifecycle, and UF2 validation
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_aacp_mic.c src/btstack/aacp_mic_protocol.c -o /tmp/test-aacp
          /tmp/test-aacp
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_aacp_control.c src/btstack/aacp_control.c -o /tmp/test-control
          /tmp/test-control
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src tests/test_control_command.c src/control_command.c -o /tmp/test-console
          /tmp/test-console
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/transport_mocks -I src/btstack tests/test_aacp_transport.c src/btstack/aacp_mic.c src/btstack/aacp_control.c src/btstack/media_input.c src/btstack/aacp_mic_protocol.c -o /tmp/test-transport
          /tmp/test-transport
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -DUSBPODS_MIC_DECODE=1 -I tests/mic_mocks -I src/btstack tests/test_mic_audio.c src/btstack/aacp_mic_audio.c src/btstack/mic_clock.c -o /tmp/test-mic-audio
          /tmp/test-mic-audio
          cc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread -DUSBPODS_MIC_DECODE=1 -I tests/mic_mocks -I src/btstack tests/test_mic_core1_threaded.c src/btstack/aacp_mic_audio.c src/btstack/mic_clock.c -o /tmp/test-mic-core1
          timeout 20 /tmp/test-mic-core1
          python3 tests/test_dualcore_mic_wiring.py
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_relay_rtp.c src/btstack/relay_rtp.c -o /tmp/test-relay
          /tmp/test-relay
          python3 tests/test_relay_lifecycle.py
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_eld_profile.c src/btstack/eld_profile.c -o /tmp/test-eld-profile
          /tmp/test-eld-profile
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -DUSBPODS_MIC_DECODE=1 -I src/btstack tests/test_eld_profile.c src/btstack/eld_profile.c -o /tmp/test-eld-profile-mic
          /tmp/test-eld-profile-mic
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/encoder_mocks -I src/btstack tests/test_eld_encoder.c src/btstack/eld_encoder.c src/btstack/eld_profile.c -o /tmp/test-eld-encoder
          /tmp/test-eld-encoder
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_eld_transition.c src/btstack/eld_transition.c -o /tmp/test-eld-transition
          /tmp/test-eld-transition
          python3 tests/test_eld_adapter.py
          python3 tests/test_eld_foreground.py
          python3 tests/test_eld_pcm_tap.py
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_mic_telemetry.c src/btstack/aacp_mic_audio.c src/btstack/mic_clock.c -o /tmp/test-mic-telemetry
          /tmp/test-mic-telemetry
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/tinyusb tests/test_usb_host_input.c src/tinyusb/usb_capture_lifecycle.c src/tinyusb/usb_hid_media.c -o /tmp/test-usb-input
          /tmp/test-usb-input
          python3 tests/test_usb_input_wiring.py
          python3 tests/test_usb_control_boundaries.py
          python3 tests/test_mic_close_tap.py
          python3 tests/test_uac1_controls.py
          python3 tests/test_mic_recovery_integration.py
          python3 tests/test_live_runner.py
          python3 tests/test_validation_audit.py
          python3 tests/test_aacp_session_telemetry.py
          python3 tests/test_flash_candidate.py
          python3 tests/test_duplex_profile_contract.py
          python3 tests/test_live_matrix.py
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_media_input.c src/btstack/media_input.c -o /tmp/test-media-input
          /tmp/test-media-input
          python3 tests/test_media_input_wiring.py
          python3 tests/test_source_boundaries.py
          python3 tests/test_pcm_queue_reset.py
          python3 tests/test_control_records.py
          python3 tests/test_control_status.py
          python3 tests/test_settings_timing.py
          python3 tests/test_sdk_transport_contract.py
          python3 tests/test_sdk_response_reentry.py
          python3 tests/test_relay_sdk_routing.py
          python3 tests/test_codec_setup.py
          python3 tests/test_button_context.py
          python3 tests/test_eld_negotiation.py
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_eld_codec_config.c src/btstack/eld_codec_config.c -o /tmp/test-eld-codec-config
          /tmp/test-eld-codec-config
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I src/btstack tests/test_mic_clock.c src/btstack/mic_clock.c -o /tmp/test-mic-clock
          /tmp/test-mic-clock
          cc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread -I src/tinyusb tests/test_usb_hid_threads.c src/tinyusb/usb_hid_media.c -o /tmp/test-usb-hid-threads
          timeout 20 /tmp/test-usb-hid-threads
          python3 tests/test_verify_uf2.py
      - name: Production AU/PCM/USB clock schedules and intentional loss negative control
        if: matrix.mic == 'aaceld'
        run: |
          cc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -DUSBPODS_MIC_DECODE=1 -I tests/mic_mocks -I src/btstack -I src/tinyusb \
            tests/test_mic_service_schedules.c src/btstack/aacp_mic_audio.c \
            src/btstack/mic_clock.c src/tinyusb/usb_capture_lifecycle.c \
            -o /tmp/test-mic-service
          for case in on-time producer-gap worker-delay consumer-hold capture-epoch; do
            /tmp/test-mic-service "$case"
          done
          ulimit -c 0
          if /tmp/test-mic-service negative-worker-no-loss >/tmp/mic-negative.log 2>&1; then
            echo "::error::An intentionally false zero-USB-loss claim was accepted"
            exit 1
          fi
          grep -F 'EXPECTED_NEGATIVE_CONTROL:' /tmp/mic-negative.log
          grep -F 'usb.missing_samples==0' /tmp/mic-negative.log
      - name: Test real FDK AAC-ELD microphone profile
        if: matrix.decode == 'ON'
        run: |
          cmake -S 3rd-party/fdk-aac -B host-fdk -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_FLAGS=-fsanitize=address -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          cmake --build host-fdk --parallel 2
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address -isystem 3rd-party/fdk-aac/libAACdec/include -isystem 3rd-party/fdk-aac/libAACenc/include -isystem 3rd-party/fdk-aac/libSYS/include tests/test_mic_fdk.c host-fdk/libfdk-aac.a -lstdc++ -lm -o /tmp/test-mic-fdk
          /tmp/test-mic-fdk
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address -DUSBPODS_MIC_DECODE=1 -I tests/time_mocks -I src/btstack -isystem 3rd-party/fdk-aac/libAACdec/include -isystem 3rd-party/fdk-aac/libAACenc/include -isystem 3rd-party/fdk-aac/libSYS/include tests/test_eld_duplex_fdk.c src/btstack/eld_profile.c src/btstack/eld_encoder.c src/btstack/aacp_mic_audio.c src/btstack/mic_clock.c src/resamp44.c host-fdk/libfdk-aac.a -lstdc++ -lm -o /tmp/test-eld-duplex
          if [ "${{ matrix.dualcore || 'OFF' }}" = ON ]; then
            cc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address -pthread -DUSBPODS_MIC_DECODE=1 -DUSBPODS_MIC_PARALLEL_HOST=1 -I tests/time_mocks -I src/btstack -isystem 3rd-party/fdk-aac/libAACdec/include -isystem 3rd-party/fdk-aac/libAACenc/include -isystem 3rd-party/fdk-aac/libSYS/include tests/test_eld_duplex_fdk.c src/btstack/eld_profile.c src/btstack/eld_encoder.c src/btstack/aacp_mic_audio.c src/btstack/mic_clock.c src/resamp44.c host-fdk/libfdk-aac.a -lstdc++ -lm -o /tmp/test-eld-duplex-parallel
            timeout 90 /tmp/test-eld-duplex-parallel
          fi
          ASAN_OPTIONS=detect_leaks=0 timeout 90 /tmp/test-eld-duplex
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address -I src/btstack -isystem 3rd-party/fdk-aac/libAACdec/include -isystem 3rd-party/fdk-aac/libAACenc/include -isystem 3rd-party/fdk-aac/libSYS/include tests/test_eld_frequency.c src/btstack/eld_profile.c src/btstack/eld_encoder.c host-fdk/libfdk-aac.a -lstdc++ -lm -o /tmp/test-eld-frequency
          ASAN_OPTIONS=detect_leaks=0 /tmp/test-eld-frequency
          python3 tests/test_pcm_packet_path.py --fdk-lib host-fdk/libfdk-aac.a
          python3 tests/test_pcm_packet_path.py --fdk-lib host-fdk/libfdk-aac.a --mic-build
          if [ "${{ matrix.mic }}" = aaceld ]; then
            ulimit -c 0
            if python3 tests/test_pcm_packet_path.py --fdk-lib host-fdk/libfdk-aac.a --mic-build --negative-swap >/tmp/fdk-channel-negative.log 2>&1; then
              echo "::error::Deliberately swapped output channels passed AAC-ELD channel isolation"
              exit 1
            fi
            grep -F 'Assertion' /tmp/fdk-channel-negative.log
          fi
      - name: Audit 32-bit duplex codec allocations
        if: matrix.decode == 'ON'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-multilib
          cmake -S 3rd-party/fdk-aac -B host-fdk32 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
          cmake --build host-fdk32 --parallel 2
          cc -m32 -std=c11 -Wall -Wextra -Werror -DUSBPODS_MIC_DECODE=1 -DUSBPODS_ALLOC_AUDIT=1 -I tests/time_mocks -I src/btstack -isystem 3rd-party/fdk-aac/libAACdec/include -isystem 3rd-party/fdk-aac/libAACenc/include -isystem 3rd-party/fdk-aac/libSYS/include tests/test_eld_duplex_fdk.c tests/fdk_alloc_tracker.c src/btstack/eld_profile.c src/btstack/eld_encoder.c src/btstack/aacp_mic_audio.c src/btstack/mic_clock.c src/resamp44.c host-fdk32/libfdk-aac.a -Wl,--wrap=calloc,--wrap=malloc,--wrap=free -lstdc++ -lm -o /tmp/test-eld-duplex32
          mkdir -p evidence
          USBPODS_FDK_HEAP_REPORT=evidence/codec-heap32.json timeout 90 /tmp/test-eld-duplex32
      - name: Select and validate unchanged controller firmware
        env:
          BTFW_SELECTION: ${{ matrix.firmware }}
        run: python3 tools/btfw.py --sdk "$PICO_SDK_PATH" --image "$BTFW_SELECTION" --output evidence
      - name: Test firmware parser and audit newer UART candidate
        run: |
          python3 tests/test_btfw.py "$PICO_SDK_PATH/lib/cyw43-driver/firmware/cyw43_btfw_43439.h"
          python3 tools/audit_hcd.py --output evidence/uart0076-audit.json
      - name: Configure Pico 2 W firmware
        run: |
          if [ "$USBPODS_EDITION" = "lite" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSBPODS_BTFW=${{ matrix.firmware }} -DUSBPODS_MIC_DECODE=${{ matrix.decode }} -DUSBPODS_DUAL_CORE_MIC=${{ matrix.dualcore || 'OFF' }} -DUSBPODS_LITE=ON -DUSBPODS_REQUIRE_FULL=OFF
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSBPODS_BTFW=${{ matrix.firmware }} -DUSBPODS_MIC_DECODE=${{ matrix.decode }} -DUSBPODS_DUAL_CORE_MIC=${{ matrix.dualcore || 'OFF' }} -DUSBPODS_LITE=OFF -DUSBPODS_REQUIRE_FULL=ON
          fi
      - name: Build
        run: cmake --build build --parallel 2 -- -k 0
      - name: Verify linked radio image and UF2
        run: |
          stem="$(cat build/usbpods-output-name.txt)"
          python3 tools/verify_build.py --build build --evidence evidence --stem "$stem"
      - name: Build SCO diagnostics for both Pico wireless boards
        # The application candidate above is packaged only after binary checks.
        run: |
          for board in pico_w pico2_w; do
            cmake -S tests/sco_probe -B "probe-$board" -G Ninja -DPICO_BOARD="$board" -DCMAKE_BUILD_TYPE=Release
            cmake --build "probe-$board" --parallel 2
            mkdir -p "evidence/$board"
            cp evidence/firmware.json evidence/btfw.bin "evidence/$board/"
            python3 tools/verify_build.py --build "probe-$board" --evidence "evidence/$board" --stem usbpods_sco_probe
          done
      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Package microphone live-test candidate
        if: matrix.decode == 'ON' && matrix.dualcore != 'ON'
        run: |
          if ! python3 -c 'import json,sys; s=json.load(open("docs/validation-status.json")); sys.exit(not s.get("live_test_authorized") or bool(s.get("blockers")))'; then
            echo "Live candidate packaging paused during offline triage."
            exit 0
          fi
          stem="$(cat build/usbpods-output-name.txt)"
          python3 tools/package_live_test.py --build build --evidence evidence --output live-test-candidate --stem "$stem" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Upload firmware and verification evidence
        if: always() && hashFiles('evidence/firmware.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-${{ env.USBPODS_EDITION }}-${{ matrix.firmware }}-${{ matrix.mic }}
          if-no-files-found: error
          path: |
            build/*.uf2
            build/*.elf
            build/*.bin
            evidence/**/*.json
            probe-*/usbpods_sco_probe.uf2
            probe-*/usbpods_sco_probe.elf
            probe-*/usbpods_sco_probe.bin
            build/CMakeCache.txt
            build/compile_commands.json
            build/*.map
            live-test-candidate/**

